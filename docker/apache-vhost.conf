# Port 80 is rewritten to $PORT by docker/entrypoint.sh at start-up.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Nothing outside public/ is reachable, but deny dotfiles explicitly.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Long-lived caching for fingerprinted Vite assets.
    <LocationMatch "^/build/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
