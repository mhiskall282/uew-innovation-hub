# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Lowest-cost setup: one free Docker web service + one free PostgreSQL database.
#   - Free web services sleep after 15 minutes without traffic (first request then takes ~1 minute).
#   - Free Render Postgres databases expire after 30 days. For anything beyond a demo, either
#     upgrade the database plan or point DB_URL at a free Neon database (see docs/deployment.md).
#   - The free plan has no persistent disk. Uploaded PDFs are lost on redeploy unless
#     DOCUMENTS_DISK=s3 with an S3-compatible bucket (Cloudflare R2 has a free tier).
#
# Deploy: Render dashboard > New > Blueprint > select this repository.
# Render will prompt for the values marked `sync: false`.

services:
  - type: web
    name: uew-innovation-hub
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: UEW Innovation Hub
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false # e.g. https://uew-innovation-hub.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: TRUSTED_PROXIES
        value: "*"

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: uew-innovation-hub-db
          property: connectionString

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # First Hub Director account, created on first boot.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        value: Hub Director
      - key: ADMIN_PASSWORD
        sync: false # 12+ characters, upper and lower case and a number

      # Set to "true" only for a public demo; never for real data.
      - key: SEED_DEMO_DATA
        value: "false"

      # Uploaded documents. "private" = container disk (lost on redeploy on the free plan).
      - key: DOCUMENTS_DISK
        value: private
      # For S3/R2 set DOCUMENTS_DISK=s3 and fill these in:
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"

      # Mail: "log" until SMTP details are available.
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: innovationhub@uew.edu.gh
      - key: MAIL_FROM_NAME
        value: UEW Innovation Hub

databases:
  - name: uew-innovation-hub-db
    databaseName: uew_innovation_hub
    user: uew_hub
    plan: free
